[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tars-agent"
version = "0.1.0"
description = "Code / build / test / scaffolding agent: project scaffolding from templates, language-agnostic build/test dispatch, and roots-scoped git operations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

# The importable package and the console script are both `tars` -- no
# hyphen collision to work around here, unlike Wall-E (`wall-e` command /
# `walle` package).
[project.scripts]
tars = "tars.cli:main"

[tool.setuptools.packages.find]
include = ["tars*"]

# Templates are plain data files (pyproject.toml, package.json, .gitignore,
# README.md, source/test files) shipped inside the installed package so
# `tars new` works from an installed console script, not just from a repo
# checkout.
[tool.setuptools.package-data]
tars = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
